[project]
name = "QtLattice"
version = "0.1.0"
authors = [
  {name = "Marco Brasini", email = "brasinimarco@gmail.com"},
]
description = "QtLattice package"
dependencies = [
  "pyqtconsole",
  "PyQt5",
  "vtk",
  "numpy",
  "pyLattice",
  "vtkLattice",
]
requires-python = ">=3.8"
readme = "README.md"
license = "GPL-3.0-or-later"
keywords = ["Qt", "Lattice"]
classifiers = [
  "Programming Language :: Python",
  "License :: OSI Approved :: GPL-3.0 License",
]


[project.optional-dependencies]
test = [
  "pytest",
]
